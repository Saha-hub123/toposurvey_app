name: Build & Release TopoSurvey Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Auto Tag, Compile Flutter & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Project Dependencies
        run: |
          flutter pub get

      - name: Run Quality Check & Unit Tests
        run: |
          flutter test

      - name: Generate Automatic Release Tag
        id: tag_generator
        run: |
          # If triggered by an existing git tag, use that tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            # Automatic semantic versioning: v1.0.<run_number>
            RELEASE_TAG="v1.0.${{ github.run_number }}"
            echo "Auto-creating git tag: $RELEASE_TAG"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Automated TopoSurvey Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG" || echo "Tag already pushed or remote skipped"
          fi
          echo "tag_name=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Build Universal Android Release APK
        run: |
          flutter build apk --release

      - name: Build Split Per-ABI APKs (Optimized for Arm64 & Arm32)
        run: |
          flutter build apk --release --split-per-abi

      - name: Rename & Organize APK Binaries
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/TopoSurvey-Universal-${{ steps.tag_generator.outputs.tag_name }}.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/TopoSurvey-arm64-v8a-${{ steps.tag_generator.outputs.tag_name }}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/TopoSurvey-armeabi-v7a-${{ steps.tag_generator.outputs.tag_name }}.apk
          ls -lh release-artifacts/

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_generator.outputs.tag_name }}
          name: "TopoSurvey 3D Release ${{ steps.tag_generator.outputs.tag_name }}"
          body: |
            ## 🏔️ TopoSurvey 3D - Multi-Phone Topographic Surveying APK

            ### 🚀 Fitur Rilis:
            - **Multilaterasi / Trilaterasi Kooperatif (Minimal 3 Handphone)**:
              - Mengatasi batas akurasi GPS HP standar (5-10m) dengan menghitung posisi relatif sub-meter melalui baseline segitiga 3 Base Anchor.
            - **Penguatan Jarak BLE (Bluetooth Low Energy)**:
              - Filter Kalman 1D pada stream RSSI untuk mengeliminasi noise multipath sinyal radio.
              - Model propagasi Log-Distance Path Loss dengan kalibrasi lapangan langsung.
            - **Sensor Fusi Barometer Diferensial**:
              - Penentuan beda tinggi kontur permukaan ($\Delta Z$) presisi tinggi hingga ~10-20 cm tanpa terpengaruh cuaca berkat koreksi real-time Base Anchor A.
            - **Sinkronisasi Mesh UDP Offline**:
              - Berjalan 100% tanpa internet menggunakan Portable Wi-Fi Hotspot lokal antar handphone.
            - **Visualisasi & Ekspor**:
              - Peta 2D/3D kontur ketinggian permukaan dengan color gradient.
              - Ekspor format standard: **CSV (PNEZD)**, **AutoCAD 3D DXF**, dan **GeoJSON**.

            ### 📦 Unduh File APK:
            - **`TopoSurvey-Universal-${{ steps.tag_generator.outputs.tag_name }}.apk`**: Kompatibel untuk semua model Android.
            - **`TopoSurvey-arm64-v8a-${{ steps.tag_generator.outputs.tag_name }}.apk`**: Lebih ringan, khusus HP Android modern 64-bit.
            - **`TopoSurvey-armeabi-v7a-${{ steps.tag_generator.outputs.tag_name }}.apk`**: Khusus HP Android 32-bit.
          files: |
            release-artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
