name: Build & Release TopoSurvey (Android & iOS)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom Tag Release (e.g. v1.1.0, leave empty for auto-tag)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  # ==========================================
  # JOB 1: GENERATE GIT RELEASE TAG
  # ==========================================
  generate-tag:
    name: Generate Git Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag_generator.outputs.tag_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine & Push Release Tag
        id: tag_generator
        run: |
          if [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            RELEASE_TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            # Automatic semantic versioning: v1.2.<run_number>
            RELEASE_TAG="v1.2.${{ github.run_number }}"
            echo "Auto-creating git tag: $RELEASE_TAG"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Automated TopoSurvey Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG" || echo "Tag already pushed or remote skipped"
          fi
          echo "tag_name=$RELEASE_TAG" >> $GITHUB_OUTPUT

  # ==========================================
  # JOB 2: COMPILE ANDROID APKS (LINUX)
  # ==========================================
  build-android:
    name: Compile Android APKs
    needs: generate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Universal Android Release APK
        run: flutter build apk --release

      - name: Build Split Per-ABI APKs (Arm64 & Arm32)
        run: flutter build apk --release --split-per-abi

      - name: Rename & Organize Android Binaries
        run: |
          mkdir -p android-artifacts
          TAG="${{ needs.generate-tag.outputs.tag_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk android-artifacts/TopoSurvey-Android-Universal-$TAG.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk android-artifacts/TopoSurvey-Android-arm64-v8a-$TAG.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk android-artifacts/TopoSurvey-Android-armeabi-v7a-$TAG.apk
          ls -lh android-artifacts/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: android-artifacts/*
          retention-days: 1

  # ==========================================
  # JOB 3: COMPILE IOS BINARIES & SOURCE (MACOS)
  # ==========================================
  build-ios:
    name: Compile iOS IPA & Source
    needs: generate-tag
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Stable Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version || true

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Flutter iOS App (Release, No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Sideloadable IPA and App Bundle
        run: |
          mkdir -p ios-artifacts
          TAG="${{ needs.generate-tag.outputs.tag_name }}"

          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../ios-artifacts/TopoSurvey-iOS-Unsigned-$TAG.ipa Payload
          zip -r ../../../ios-artifacts/TopoSurvey-iOS-RunnerApp-$TAG.zip Runner.app
          cd ../../..

      - name: Package Configured iOS Source Code
        run: |
          TAG="${{ needs.generate-tag.outputs.tag_name }}"
          zip -r ios-artifacts/TopoSurvey-iOS-SourceCode-$TAG.zip \
            lib/ \
            ios/ \
            pubspec.yaml \
            pubspec.lock \
            analysis_options.yaml \
            README.md \
            -x "*.git*" "ios/Pods/*" "build/*" ".dart_tool/*"
          ls -lh ios-artifacts/

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-binaries
          path: ios-artifacts/*
          retention-days: 1

  # ==========================================
  # JOB 4: PUBLISH UNIFIED GITHUB RELEASE
  # ==========================================
  publish-release:
    name: Publish Unified GitHub Release
    needs: [generate-tag, build-android, build-ios]
    if: always() && needs.generate-tag.result == 'success' && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-binaries
          path: release-assets

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-binaries
          path: release-assets

      - name: Package Complete Project Source Code
        run: |
          TAG="${{ needs.generate-tag.outputs.tag_name }}"
          zip -r release-assets/TopoSurvey-FullSourceCode-$TAG.zip . \
            -x "*.git*" "build/*" ".dart_tool/*" "*.apk" "*.ipa"
          ls -lh release-assets/

      - name: Create Unified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate-tag.outputs.tag_name }}
          name: "TopoSurvey Release ${{ needs.generate-tag.outputs.tag_name }}"
          body: |
            ## 🏔️ TopoSurvey 3D - Multi-Phone Topographic Surveying & Contour Mapping (v1.2.0)

            Rilis resmi **TopoSurvey v1.2.0** menghadirkan pembaruan kritis stabilitas lapangan: **Patch Anti-Drift & Scattering GPS**, **Proteksi Sensor BLE Anti-Perangkat Asing**, **Dukungan Operasi Fleksibel Mode 3 HP (2 Base + 1 Rover)**, dan **Penyimpanan Pengaturan Persisten**.

            Aplikasi ini dirancang untuk pemetaan topografi kontur lahan menggunakan kolaborasi smartphone (Android & iOS) dengan trilaterasi radio BLE, altimetri barometer diferensial presisi tinggi, dan sinkronisasi Wi-Fi Hotspot P2P (UDP Mesh).

            ---

            ### 🚀 Fitur Baru & Perbaikan Kritis di v1.2.0:
            1. **Modul Lokasi & GPS Anti-Drift (Solusi Titik Melompat/Menyebar):**
               - **Accuracy Threshold Filter (≤ 5.0m):** Mengabaikan pembaruan lokasi jika radius ketidakpastian GPS melebihi standar toleransi survei.
               - **Minimum Displacement (1.0m):** Mencegah penumpukan data (*drift scattering*) saat surveyor sedang diam di satu titik (`setSmallestDisplacement(1.0f)`).
               - **Outlier Rejection:** Mendeteksi kecepatan pergerakan tidak wajar (> 4.5 m/s) atau lonjakan jarak ekstrem dalam hitungan detik untuk dibuang dari perhitungan.
               - **Live Stream Tracking:** Sinkronisasi GPS otomatis untuk geo-referencing titik ukur Rover di lapangan.

            2. **Proteksi Sinyal BLE & Anti-Deteksi Perangkat Liar:**
               - **Signal Strength Cutoff (RSSI ≥ -80 dBm):** Mengabaikan sinyal liar dari smartphone atau perangkat asing di luar jangkauan efektif survei.
               - **MAC Address Whitelisting:** Opsi filter berbasis MAC perangkat patok survei (Base Station A/B/C) terdaftar.
               - **Advertising Payload Parser:** Membaca byte array telemetri khusus TopoSurvey 3D dan otomatis me-reject sinyal asing yang formatnya tidak sesuai.
               - **Live Telemetry & Shield Banner:** Menampilkan statistik real-time jumlah sinyal lemah dan perangkat liar yang berhasil ditolak sistem.

            3. **Dukungan Operasional Mode 3 HP (2 Patok Base + 1 Rover):**
               - Memungkinkan survei topografi hanya dengan **3 smartphone** (2 Base Station di patok A & B + 1 Rover di jalon ukur).
               - Algoritma interseksi lingkaran 2-titik bilateral dipadukan dengan elevasi barometer diferensial.
               - Fitur **Tukar Sisi Baseline (+Y / -Y)** instan langsung dari layar Rover jika area survei berada di seberang garis patok A-B.
               - Otomatis upgrade ke trilaterasi kuadrat terkecil (Least Squares) jika 3 atau lebih Base Station terdeteksi.

            4. **Penyimpanan Pengaturan Persisten (SharedPreferences):**
               - Nilai ambang batas GPS, toleransi RSSI BLE, whitelisting, dan preferensi sisi kuadran survei tersimpan permanen di perangkat tanpa perlu disetel ulang saat membuka aplikasi.

            5. **Penyempurnaan Tampilan & Simulasi Cerdas:**
               - Tombol Simulasi diperjelas dengan dialog konfirmasi dan banner ungu pada Rover agar tidak membingungkan surveyor saat digunakan di lapangan asli.
               - Deteksi otomatis mode simulasi 3 HP atau 4 HP sesuai konfigurasi patok.

            ---

            ### 📦 Berkas Unduhan Rilis:

            #### 📱 Untuk Android:
            - **`TopoSurvey-Android-Universal-${{ needs.generate-tag.outputs.tag_name }}.apk`**: Kompatibel untuk semua model Android.
            - **`TopoSurvey-Android-arm64-v8a-${{ needs.generate-tag.outputs.tag_name }}.apk`**: Lebih ringan, khusus HP Android modern 64-bit.
            - **`TopoSurvey-Android-armeabi-v7a-${{ needs.generate-tag.outputs.tag_name }}.apk`**: Khusus HP Android 32-bit.

            #### 🍏 Untuk Apple iOS (iPhone / iPad):
            - **`TopoSurvey-iOS-Unsigned-${{ needs.generate-tag.outputs.tag_name }}.ipa`**: Berkas instalasi iOS biner siap pasang via **Sideloadly** (dari laptop Windows/Mac), **AltStore**, atau **TrollStore** tanpa akun Apple Developer berbayar.
            - **`TopoSurvey-iOS-SourceCode-${{ needs.generate-tag.outputs.tag_name }}.zip`**: Source code terkonfigurasi lengkap izin native iOS (`Info.plist`) siap dibuka dan di-install lewat **Xcode** di Mac dengan Apple ID gratis.
            - **`TopoSurvey-iOS-RunnerApp-${{ needs.generate-tag.outputs.tag_name }}.zip`**: Bundle biner `Runner.app`.

            #### 💻 Source Code Lengkap:
            - **`TopoSurvey-FullSourceCode-${{ needs.generate-tag.outputs.tag_name }}.zip`**: Seluruh source code proyek TopoSurvey.
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
